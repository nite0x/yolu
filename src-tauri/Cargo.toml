[package]
name = "yolu-desktop"
version = "0.1.0"
edition = "2021"
default-run = "yolu-desktop"
description = "Yolu — a task-centered workspace for cross-project development"
repository = "https://github.com/nite0x/yolu"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Rust 1.95's debuginfo stripping can produce misaligned proc-macro dylibs on
# newer macOS dyld (rust-lang/rust#157750). Keep build-time metadata intact.
[profile.release.build-override]
strip = "none"
