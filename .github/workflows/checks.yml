name: Core checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The application JSDOM suite exceeds Node's default 2 GiB heap on macOS.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run api:check
      - run: npm run build
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./...
      - run: go vet ./...
      - name: Isolated conversation workflow
        run: |
          go build -o "$RUNNER_TEMP/yolu-backend" .
          node scripts/desktop-workflow-smoke.mjs "$RUNNER_TEMP/yolu-backend"
      - run: go test -race ./internal/acp ./internal/codex ./internal/store ./internal/project ./internal/session ./internal/terminal ./internal/execution ./internal/app

  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check
      - run: npm run ui:build
      - run: npm run build
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: node --test scripts/*.test.cjs
      - run: npm run chat:test && npm run app:test
      - run: go test ./...
      - run: go vet ./...
      - name: Isolated conversation workflow
        run: |
          go build -o "$RUNNER_TEMP/yolu-backend" .
          node scripts/desktop-workflow-smoke.mjs "$RUNNER_TEMP/yolu-backend"
      - run: go test -race ./internal/acp ./internal/codex ./internal/store ./internal/project ./internal/session ./internal/terminal ./internal/execution ./internal/app
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser conversation workflows
        run: |
          go build -o "$RUNNER_TEMP/yolu-browser-backend" .
          YOLU_TEST_BINARY="$RUNNER_TEMP/yolu-browser-backend" npm run browser:test
      - run: npm run ui:test:browser
      - run: npm run desktop:check
