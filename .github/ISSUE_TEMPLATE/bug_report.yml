name: Bug report
description: Report a reproducible problem in Yolu
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, Yolu version, and Codex CLI version if relevant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use an isolated example repository when possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, service.json contents, private paths and conversation content before sharing.
