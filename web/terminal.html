<!doctype html>
<html lang="zh-CN" data-workhub-desktop>
<head>
  <meta charset="utf-8">
  <meta name="ui-color-theme" content="__UI_COLOR_THEME__">
  <script src="/core/browser-compat.js"></script>
  <script src="/ui/browser-runtime.js" defer></script>
  <script src="/core/appearance.js"></script>
  <meta name="ui-language" content="__UI_LANGUAGE__">
  <script src="/ui/i18n.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <meta name="style-nonce" content="__STYLE_NONCE__">
  <title data-i18n="终端 · Yolu">终端 · Yolu</title>
  <link rel="stylesheet" href="/ui/terminal.css">
  <script src="/ui/terminal.js" defer></script>
  <link rel="stylesheet" href="/core/appearance.css">
  <link rel="stylesheet" href="/core/typography.css">
  <link rel="stylesheet" href="/core/chrome.css">
</head>
<body class="terminal-page">
  <div id="terminalSurface"></div>
  <p id="terminalFeedback" role="status" hidden></p>
  <main id="terminalLauncher">
    <section class="terminal-launch-content conversation-start conversation-creation-setup">
      <div id="terminalCreationSetup"></div>
      <form id="terminalForm">
        <div class="terminal-directory-field">
          <label for="terminalProject" data-i18n="工作目录">工作目录</label>
          <span class="terminal-select"><select id="terminalProject" aria-describedby="terminalDirectoryPath" disabled></select></span>
          <code id="terminalDirectoryPath" class="terminal-help" hidden></code>
          <p id="terminalDirectoryHint" class="terminal-help" data-i18n="请先注册一个本机项目，再启动终端。" hidden>请先注册一个本机项目，再启动终端。</p>
        </div>
        <div id="terminalProfileChoices" role="group" aria-label="终端工具" data-i18n-aria-label="终端工具"></div>
        <details id="customTerminal" class="terminal-disclosure" hidden>
          <summary data-i18n="自定义 Agent">自定义 Agent</summary>
          <fieldset id="customTerminalFields">
            <label id="terminalCustomProfileField" hidden><span data-i18n="启动配置">启动配置</span><span class="terminal-select"><select id="terminalProfile"></select></span></label>
            <label><span data-i18n="名称">名称</span><input id="customName" placeholder="例如：我的 Agent" maxlength="80" data-i18n-placeholder="例如：我的 Agent"></label>
            <label><span data-i18n="可执行文件">可执行文件</span><input id="customExecutable" placeholder="命令名称或绝对路径" autocomplete="off" spellcheck="false" data-i18n-placeholder="命令名称或绝对路径"></label>
            <label><span data-i18n="参数（JSON 数组）">参数（JSON 数组）</span><textarea id="customArgs" rows="2" spellcheck="false">[]</textarea></label>
            <label><span data-i18n="环境变量（JSON 对象，仅用于本次启动）">环境变量（JSON 对象，仅用于本次启动）</span><textarea id="customEnv" rows="2" spellcheck="false">{}</textarea></label>
            <div class="terminal-form-footer">
              <button id="saveTerminalProfile" type="button" data-i18n="保存启动配置">保存启动配置</button>
              <button id="startTerminal" class="primary" type="submit" data-i18n="启动自定义 Agent">启动自定义 Agent</button>
            </div>
          </fieldset>
        </details>
        <p id="terminalLaunchFeedback" class="terminal-launch-feedback" role="status" hidden></p>
      </form>
    </section>
    <details id="terminalExisting" class="terminal-existing" hidden><summary id="terminalExistingSummary" data-i18n="已有终端">已有终端</summary><div class="terminal-existing-body"><button id="refreshTerminals" type="button" data-i18n="刷新">刷新</button><div id="terminalList"></div></div></details>
  </main>
  <section id="terminalConsole" hidden aria-label="交互式终端" data-i18n-aria-label="交互式终端">
    <div id="terminalScreen"></div>
  </section>
  <dialog id="stopTerminalDialog"><form method="dialog"><h2 data-i18n="结束这个终端？">结束这个终端？</h2><p data-i18n="终端中的 Agent 和子进程将结束。仅需收起页面时，请使用“关闭视图”。">终端中的 Agent 和子进程将结束。仅需收起页面时，请使用“关闭视图”。</p><div><button value="cancel" data-i18n="取消">取消</button><button class="danger" value="stop" data-i18n="结束进程">结束进程</button></div></form></dialog>
</body>
</html>
