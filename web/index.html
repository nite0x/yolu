  <div class="shell">
    <main>
      <div class="page-heading"><div><div class="eyebrow" id="eyebrow">WORKSPACES</div><div class="resource-detail-title"><a href="#/workspaces" id="backToWorkspaces" class="resource-breadcrumb-link" aria-label="返回工作区列表" data-i18n-aria-label="返回工作区列表" data-i18n="工作区" hidden>工作区</a><span id="workspaceBreadcrumbSeparator" class="resource-breadcrumb-divider" aria-hidden="true" hidden>/</span><span id="workspaceTitleIcon" hidden></span><h1 id="pageTitle" tabindex="-1" data-i18n="工作区">工作区</h1><span id="workspaceSwitcherTrigger" class="shadcn-scope" hidden></span></div><p id="pageSubtitle" data-i18n="围绕一项开发目标，集中管理相关项目的工作目录、分支和对话。">围绕一项开发目标，集中管理相关项目的工作目录、分支和对话。</p></div><span id="newWorkspaceButton" class="shadcn-scope"></span><div id="workspacePageActions" hidden></div></div>

        <h1 id="issuesHeading" tabindex="-1" data-i18n="Issues">Issues</h1>
        <p data-i18n="在 Linear 查看分配给你的任务。">在 Linear 查看分配给你的任务。</p>
        <a class="resource-breadcrumb-link" id="openLinear" href="https://linear.app/" target="_blank" rel="noopener noreferrer" data-i18n="打开 Linear">打开 Linear</a>
      </section>
      <section id="settingsPage" class="settings-page shadcn-scope" aria-label="设置" hidden data-i18n-aria-label="设置"></section>
      <section class="content-panel" id="workContent">
        <section id="workspaceBrowser" class="workspace-browser resource-list-page workspace-pane shadcn-scope" aria-label="工作区列表" hidden data-i18n-aria-label="工作区列表">

            <div class="workspace-browser-heading"><h1 id="workspaceListTitle" tabindex="-1" data-i18n="工作区">工作区</h1></div>
            <div id="workspaceToolbarSlot"></div><span id="workspaceCreateSlot"></span>
          </div>
          <div id="workspaceListContent" class="workspace-list-scroll resource-list-scroll" aria-label="全部工作区" data-i18n-aria-label="全部工作区"></div>
        </section>

      <p id="removalDescription"></p>
      <p id="removalPreserved" data-i18n="目录、仓库、分支、Worktree 和原始对话均保留。磁盘清理需要单独操作。">目录、仓库、分支、Worktree 和原始对话均保留。磁盘清理需要单独操作。</p>
      <div id="removalReferences"></div>
      <div id="removalError" class="form-error" role="alert" hidden></div>
      <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-i18n="取消">取消</button><button type="submit" id="removalConfirm" class="button danger" disabled></button></div>
    </form>
