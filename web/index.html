<!doctype html>
<html lang="zh-CN" data-workhub-desktop>
<head>
  <meta charset="utf-8">
  <meta name="ui-color-theme" content="__UI_COLOR_THEME__">
  <meta name="ui-send-shortcut" content="__UI_SEND_SHORTCUT__">
  <script src="/core/chat-input.js"></script>
  <script src="/core/browser-compat.js"></script>
  <script src="/core/appearance.js"></script>
  <meta name="ui-language" content="__UI_LANGUAGE__">
  <script src="/ui/i18n.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <meta name="session-mode" content="__SESSION_MODE__">
  <meta name="color-scheme" content="light">
  <title>Yolu</title>
  <meta name="theme-color" content="#203f42">
  <script src="/core/app-bootstrap.js"></script>
  <script src="/core/conversation-list-width.js" defer></script>
  <link rel="icon" href="/yolu.ico" sizes="16x16 32x32 48x48 256x256">
  <link rel="icon" href="/yolu.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/core/style.css">
  <link rel="stylesheet" href="/features/projects/git.css">
  <link rel="stylesheet" href="/features/projects/projects.css">
  <link rel="stylesheet" href="/features/sessions/sessions.css">
  <link rel="stylesheet" href="/features/sessions/conversations.css">
  <link rel="stylesheet" href="/core/list-search.css">
  <link rel="stylesheet" href="/features/settings/settings.css">
  <link rel="stylesheet" href="/ui/ui.css">
  <link rel="stylesheet" href="/chat/assistant.css">
  <link rel="stylesheet" href="/core/desktop-frame.css">
  <script src="/ui/ui.js" defer data-ui-bundle></script>
  <script src="/chat/loader.js" defer></script>
  <script src="/core/core.js" defer></script>
  <script src="/features/projects/projects.js" defer></script>
  <script src="/core/app.js" defer></script>
  <script src="/features/settings/environments.js" defer></script>
  <script src="/features/projects/git.js" defer></script>
  <script src="/features/projects/worktrees.js" defer></script>
  <script src="/features/settings/terminal.js" defer></script>
  <script src="/features/settings/settings.js" defer></script>
  <script src="/features/sessions/sessions.js" defer></script>
  <script src="/features/sessions/session-history.js" defer></script>
  <script src="/features/sessions/session-history-live.js" defer></script>
  <script src="/features/sessions/session-chat.js" defer></script>
  <script src="/features/sessions/session-create.js" defer></script>
  <script src="/features/sessions/conversations.js" defer></script>
  <script src="/core/resource-navigation.js" defer></script>
  <script src="/core/page-bridge.js" defer></script>
  <link rel="stylesheet" href="/core/shortcut-icons.css">
  <link rel="stylesheet" href="/core/typography.css">
  <link rel="stylesheet" href="/core/appearance.css">
  <link rel="stylesheet" href="/core/chrome.css">
  <link rel="stylesheet" href="/core/resource-pages.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Yolu 首页" data-i18n-aria-label="Yolu 首页"><img class="brand-mark" src="/yolu.svg" alt="" width="36" height="36"><span>Yolu<small data-i18n="让每一份工作，各就其位。">让每一份工作，各就其位。</small></span></a>
    <div class="nav-label" data-i18n="工作台">工作台</div>
    <nav aria-label="主导航" data-i18n-aria-label="主导航">
      <button type="button" id="openGlobalSearch" class="nav-item" aria-label="全局搜索" title="全局搜索" data-i18n-aria-label="全局搜索" data-i18n-title="全局搜索" aria-haspopup="dialog" aria-keyshortcuts="Meta+K Control+K"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></span><span class="nav-text" data-i18n="全局搜索">全局搜索</span></button>
      <button class="nav-item" data-view="projects" aria-label="项目" title="项目" data-i18n-title="项目" data-i18n-aria-label="项目"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-text" data-i18n="项目">项目</span><span class="nav-count" id="projectCount">0</span></button>
      <button class="nav-item active" data-view="sessions" aria-label="对话" title="对话" data-i18n-title="对话" data-i18n-aria-label="对话"><span class="nav-icon" aria-hidden="true">◌</span><span class="nav-text" data-i18n="对话">对话</span><span id="sessionNavigationStatus" class="session-navigation-status" role="status"></span></button>
      <button class="nav-item" type="button" data-view="issues" aria-label="任务" title="任务" data-i18n-aria-label="任务" data-i18n-title="任务"><span class="nav-icon" aria-hidden="true"></span><span class="nav-text" data-i18n="任务">任务</span></button>
    </nav>
    <footer class="sync workspace-status sidebar-footer" aria-label="工作台状态" data-i18n-aria-label="工作台状态">
      <div class="sidebar-status-copy">
        <div class="sidebar-status-line"><span class="live-dot updating" id="syncDot" aria-hidden="true"></span><span id="syncText" role="status" data-i18n="更新中…">更新中…</span></div>
        <div class="sidebar-bottom"><span id="platformLabel" data-i18n="本机工作台">本机工作台</span><span class="version">v0.2</span></div>
      </div>
      <div class="sidebar-footer-actions">
        <span id="refreshControl" class="shadcn-scope"></span>
        <button type="button" class="sidebar-settings nav-item" data-view="settings" title="设置" aria-label="设置" data-i18n-title="设置" data-i18n-aria-label="设置"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.7 4.3.6-2.3h3.4l.6 2.3 1.9 1.1 2.3-.6 1.7 3-1.7 1.7v2.2l1.7 1.7-1.7 3-2.3-.6-1.9 1.1-.6 2.3h-3.4l-.6-2.3-1.9-1.1-2.3.6-1.7-3 1.7-1.7V9.5L3.8 7.8l1.7-3 2.3.6Z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </footer>
  </aside>
  <div class="shell">
    <main>
      <div id="offlineFeedback" class="shadcn-scope"></div>
      <section id="issuesPage" class="issues-page shadcn-scope" aria-labelledby="issuesHeading" hidden>
        <h1 id="issuesHeading" tabindex="-1" data-i18n="任务">任务</h1>
        <p data-i18n="在 Linear 查看分配给你的任务。">在 Linear 查看分配给你的任务。</p>
        <a class="resource-breadcrumb-link" id="openLinear" href="https://linear.app/" target="_blank" rel="noopener noreferrer" data-i18n="打开 Linear">打开 Linear</a>
      </section>
      <section id="settingsPage" class="settings-page shadcn-scope" aria-label="设置" hidden data-i18n-aria-label="设置"></section>
      <section class="content-panel" id="workContent">
        <div class="panel-toolbar" id="panelToolbar"><div class="panel-title" id="panelTitle" role="heading" aria-level="1" tabindex="-1" data-i18n="项目">项目</div><div class="toolbar-actions"><div class="shadcn-scope" id="projectEnvironmentWrap" hidden></div><div id="searchField" class="shadcn-scope"></div><span id="projectAddButton" class="shadcn-scope" hidden></span></div></div>
        <section id="content" aria-live="polite"></section>
      </section>
      <section id="sessionsPage" class="sessions-page" aria-label="对话" hidden data-i18n-aria-label="对话"><div id="sessionPageMount"></div></section>
    </main>
  </div>
  <dialog id="resourceSwitcher" class="shadcn-scope" aria-labelledby="resourceSwitcherTitle"></dialog>
  <dialog id="removalDialog" aria-labelledby="removalTitle" aria-describedby="removalDescription">
    <form id="removalForm">
      <div class="dialog-header"><h2 id="removalTitle"></h2><button type="button" class="icon-button close-dialog" aria-label="关闭" data-i18n-aria-label="关闭">×</button></div>
      <p id="removalDescription"></p>
      <p id="removalPreserved" data-i18n="目录、仓库、分支、Worktree 和原始对话均保留。磁盘清理需要单独操作。">目录、仓库、分支、Worktree 和原始对话均保留。磁盘清理需要单独操作。</p>
      <div id="removalReferences"></div>
      <div id="removalError" class="form-error" role="alert" hidden></div>
      <div class="dialog-footer"><button type="button" class="button secondary close-dialog" data-i18n="取消">取消</button><button type="submit" id="removalConfirm" class="button danger" disabled></button></div>
    </form>
  </dialog>
  <dialog id="environmentDialog" class="shadcn-scope" aria-labelledby="environmentTitle"></dialog>
  <dialog id="projectDialog" class="shadcn-scope" aria-labelledby="projectDialogTitle"></dialog>
  <dialog id="changesDialog" class="changes-dialog shadcn-scope" aria-labelledby="changesTitle"></dialog>
  <dialog id="worktreeDialog" class="wide-dialog shadcn-scope" aria-labelledby="worktreeTitle"></dialog>
  <dialog id="gitDialog" class="git-dialog shadcn-scope" aria-labelledby="gitTitle"></dialog>
  <dialog id="commandDialog" class="wide-dialog shadcn-scope" aria-labelledby="commandTitle" aria-describedby="commandDescription"></dialog>
  <div class="busy-panel" id="busyPanel" role="status" hidden><span class="spinner"></span><div><strong id="busyTitle" data-i18n="处理中…">处理中…</strong><small data-i18n="请稍候，正在操作本地仓库…">请稍候，正在操作本地仓库…</small></div></div>
  <div id="toast" class="toast shadcn-scope" role="status" hidden></div>
  <dialog id="sessionCommandOutputDialog" class="session-command-output-dialog shadcn-scope" aria-labelledby="sessionCommandOutputTitle"></dialog>
</body>
</html>
